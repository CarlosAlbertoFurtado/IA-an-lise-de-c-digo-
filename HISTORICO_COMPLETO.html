**Texto do Assistente:**

> 
> Na prática, eles **não** esperam que um estagiário já chegue dominando Svelte, Hono ou Drizzle ORM (pois são ferramentas mais de nicho, porém muito modernas). O que eles *realmente* querem é alguém que:
> *   **Seja desenrolado com JavaScript e TypeScript:** Eles precisam de alguém que não tenha medo de mexer tanto no Front-end (HTML/CSS/JS) quanto no Back-end (APIs/Node). 
> *   **Entenda de APIs e Integrações:** Eles citam "integrações com soluções de AI" e "serviços de terceiros". Na prática, significa fazer requisições (usando \`fetch\` ou SDKs no Node.js) para APIs como da OpenAI, Anthropic, etc.
> *   **Conheça Banco de Dados Relacional:** Citaram PostgreSQL e Drizzle ORM. Eles querem alguém que saiba como criar tabelas e fazer consultas (o seu conhecimento em SQL ajuda muito aqui).
> *   **Boas práticas e Fluxo de Trabalho (O diferencial):** Eles deram foco em Code Reviews, Git, documentação e "trade-offs". Estão buscando um perfil maduro, que consiga discutir sobre o que está fazendo e por que está fazendo.
>

## 4. O Escopo do Projeto CodeLens AI (Assistente)
**Texto do Assistente:**
> Excelente iniciativa! Para impressionar de verdade e dominar 100% da stack deles (que é super moderna, conhecida como "BETH stack" ou "Serverless/Edge stack"), precisamos de um projeto que não seja um simples "To-Do List". Precisa ser algo que resolva um problema real de engenharia.
> 
> Criei e salvei no seu diretório um documento chamado \`PROJETO_WIVBR_CODELENS.md\` com o escopo completo. 
> 
> ### Resumo do Projeto: **CodeLens AI**
> A ideia é construir uma plataforma de **Code Review Automatizado**. O usuário cola um trecho de código e a aplicação usa IA para fazer um "Code Review" identificando vulnerabilidades, complexidade e sugerindo melhorias (clean code).
> 
> Aqui está como ele abrange **tudo** que a vaga pede:
> 
> 1. **Svelte/SvelteKit & TailwindCSS**: Você construirá toda a interface visual (Dashboards de histórico, tela de submissão) com Tailwind (interfaces modernas e responsivas).
> 2. **Hono & Cloudflare Workers**: Todo o back-end vai rodar "na Edge" com o Hono. Você criará a API que recebe o código do front-end.
> 3. **Zod**: Toda requisição que o front-end mandar para o back-end será estritamente validada pelo Zod para garantir que o usuário mandou o formato correto.
> 4. **Drizzle ORM & PostgreSQL**: Você vai conectar o Hono num banco Postgres (usando o *Neon.tech*, por exemplo) através do Drizzle para salvar os usuários e o histórico de análises de código de cada um.
> 5. **Integrações de AI (JavaScript/NodeJS)**: Você fará o back-end consumir a API da OpenAI para gerar a análise técnica do código.
> 6. **Desenvolvimento de ponta a ponta**: Você criará desde o banco de dados, a API até as telas do usuário.
> 
> Se quiser começar a codar esse projeto agora, nós podemos começar configurando o SvelteKit e o Tailwind! Me avise qual passo quer dar primeiro.
